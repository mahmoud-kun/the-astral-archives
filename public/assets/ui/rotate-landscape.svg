<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 244" fill="none" role="img" aria-label="Rotate your phone from portrait to landscape">
  <defs>
    <linearGradient id="metal" x1="77" y1="80" x2="246" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d6a0"/><stop offset=".3" stop-color="#bc8958"/><stop offset=".58" stop-color="#7cc6d1"/><stop offset="1" stop-color="#d8a56c"/>
    </linearGradient>
    <linearGradient id="screen" x1="95" y1="101" x2="222" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153e58"/><stop offset=".53" stop-color="#081c31"/><stop offset="1" stop-color="#0d2a43"/>
    </linearGradient>
    <linearGradient id="orbit" x1="69" y1="56" x2="245" y2="201" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eec28b"/><stop offset=".5" stop-color="#7be7ee"/><stop offset="1" stop-color="#dfaa78"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(0 117 -139 0 158 122)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#337e94" stop-opacity=".28"/><stop offset="1" stop-color="#2a607c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-65%" width="190%" height="230%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-40%" y="-50%" width="180%" height="220%">
      <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#000912" flood-opacity=".65"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="124" rx="139" ry="117" fill="url(#halo)"/>
  <g stroke="#70b0c1" stroke-width="1" opacity=".28">
    <path d="M160 10v16m0 191v16M28 123h17m229 0h17"/>
    <circle cx="160" cy="123" r="98" stroke-dasharray="3 11"/>
  </g>

  <!-- Prior portrait posture: etched drafting outline, not the active device -->
  <g transform="rotate(-32 159 124)" opacity=".47">
    <rect x="124" y="41" width="70" height="165" rx="13" fill="#08253a" stroke="#77a5aa" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="132" y="55" width="54" height="138" rx="7" fill="#0c3443" fill-opacity=".3" stroke="#447a83" stroke-width="1.2"/>
    <path d="M149 49h19" stroke="#bca47e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Rotation trajectory is prominent even at 120px wide -->
  <path d="M61 92C78 47 122 27 162 29" stroke="#65d0de" stroke-width="10" stroke-opacity=".12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M61 92C78 47 122 27 162 29" stroke="url(#orbit)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="m148 16 16 13-17 10" stroke="#e8bd85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 153c-15 45-56 65-105 65" stroke="#65d0de" stroke-width="10" stroke-opacity=".15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M260 153c-15 45-56 65-105 65" stroke="url(#orbit)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="m167 230-15-12 16-12" stroke="#72e2eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Landscape game viewport -->
  <g filter="url(#shadow)">
    <rect x="49" y="77" width="222" height="104" rx="17" fill="#0a2838" stroke="url(#metal)" stroke-width="5"/>
    <rect x="59" y="85" width="202" height="88" rx="12" fill="#0b1928" stroke="#426b74" stroke-width="1.7"/>
    <rect x="71" y="92" width="178" height="74" rx="5" fill="url(#screen)" stroke="#83c4cd" stroke-width="1.2"/>
    <path d="M71 128h178M159 92v74" stroke="#69bdd0" stroke-width=".75" stroke-opacity=".16"/>
    <path d="M78 154c31-30 53-22 73-14 36 16 60-26 91-36" stroke="#5cbed7" stroke-width=".75" stroke-opacity=".45"/>
    <path d="M82 111h26m-26 6h17M217 151h26m-14 6h14" stroke="#91ced7" stroke-width="1.2" stroke-opacity=".6"/>
    <circle cx="161" cy="129" r="24" fill="#bc8058" fill-opacity=".2" stroke="#d6a879" stroke-width="1.5"/>
    <ellipse cx="160" cy="129" rx="41" ry="13" transform="rotate(-24 160 129)" stroke="#f3c68d" stroke-width="2.8"/>
    <path d="M161 116c-8 0-14 6-14 13s6 13 14 13 14-6 14-13-6-13-14-13Z" fill="#c38c61" stroke="#f0c18a" stroke-width="1.5"/>
    <path d="M154 119c12-2 19 8 19 16-7 4-14 2-19-2" stroke="#f7d8a7" stroke-width="1.2" opacity=".72"/>
    <g fill="#b0eaf1"><circle cx="99" cy="103" r="1.4"/><circle cx="126" cy="153" r="1.2"/><circle cx="213" cy="106" r="1.3"/><circle cx="221" cy="135" r="1.1"/></g>
    <rect x="256" y="113" width="4" height="24" rx="2" fill="#c69c6d"/>
    <circle cx="54" cy="129" r="2.6" fill="#a9edf0"/>
    <path d="M79 96h10m-10 0v9M241 96h-10m10 0v9M79 162h10m-10 0v-9M241 162h-10m10 0v-9" stroke="#e4bb82" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <path d="M117 195h86" stroke="#6cb9c5" stroke-width="1.1" stroke-opacity=".5"/>
  <circle cx="160" cy="195" r="3" fill="#e9ba86"/>
</svg>