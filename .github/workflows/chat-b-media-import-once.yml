name: Chat B - ONE-TIME exact source designer video import
on:
  push:
    branches:
      - experiment/room-case-library-layout-fix-2026-11-14
    paths:
      - .github/workflows/chat-b-media-import-once.yml
permissions:
  contents: write
concurrency:
  group: chat-b-original-media-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/experiment/room-case-library-layout-fix-2026-11-14'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout user-approved working branch
        uses: actions/checkout@v4
        with:
          ref: experiment/room-case-library-layout-fix-2026-11-14
          fetch-depth: 1
          persist-credentials: true
      - name: Download pinned public Drive originals; hard-check every SHA256
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet gdown==5.2.0
          python - <<'PY'
          import hashlib, os, pathlib, tempfile, gdown
          items = [["1v78asR91IGBbnAWqenY4v2aZfTTN_u0m","public/assets/video/designer-game-opening-v1.mp4","d9901146f958577c2bc1aaea065f5fab42c04d5c8f1903a1d67bd038a2604a7d"],["1UO5sYEbzf2UFFupybPieoa_2I4gjii2z","public/assets/video/designer-case-1-intro-v1.mp4","104f1d20ec8a414a25dc415528d08cf7befe88b005ce7359a4331541aa5003dc"],["1tugUeTk3RcMtVrWfEAta6C6iOt35R0Xh","public/assets/video/designer-time-travel-past-v1.mp4","32533832d425eb2d7f3d3029bf0c0a47ee306c87a518c933fcfd8d419b70adab"],["1vjDCZCYOquFkJhRb63ND_Lddied3OyTp","public/assets/video/designer-case-1-outcome-v1.mp4","ff1ad0a5ca82b135e4a308fc9b6a1569858850ec73eb5213d33b8369313f7b7f"],["1aeFKVcvfglWRYOQf3u_DgaxJOtYUyfU6","public/assets/video/designer-case-1-evidence-v1.mp4","4c02130808babb45ad16e5f02369553e830194c263ed8fdc7ed22b0820476269"],["14GhVxCpyjSiclmxe6GAo-rK2sieSUNTz","public/assets/video/designer-case-2-intro-v1.mp4","864fdd346b545fc099be5c3d8c0559197cdaceabd8024cbcc3f5833e4468066d"],["15oDkj50S1dYHeZ1M92wDvo8LAHfhADWE","public/assets/video/designer-case-2-email-evidence-v1.mp4","dc4202ad7cc263c284e085384d2162c7cd7e91c7f77c44dc202dd979e1f59b90"],["1XVpZaqmhtGtO5R-ZXBUAurl5BAtFwjmP","public/assets/video/designer-case-2-units-mismatch-evidence-v1.mp4","9e055432f899d4fa05dc036e2f1526a3c1f5cfc657080d87ba5caa2560d3ce6f"],["1BVg5wPA2_2fIjrpgoGi7YGRgRskqT5nA","public/assets/video/designer-case-2-outcome-v1.mp4","a7b17c577be210382572536ff3cf3788480ffd1b9af5a5a741751ca686b34a85"],["1u-ZP3m3W5YUW2nm9J_fHxK4DIJNRleCm","public/assets/video/designer-case-3-intro-v1.mp4","a6d90fbe74e441e78c53c5bc2824a96b4b642eef522ff5f34c1b74def42f07c1"],["1VdFCysk4vb09q4tdRmFcGla0mQNB1D1_","public/assets/video/designer-case-3-approval-evidence-v1.mp4","fc096e2d5fa1776505c9802641e2fe91d70fa627220853bcfa0cee2e837b6a64"],["1e2P5Sy-VbuVVciKvIR06IEw8qIhBnWaT","public/assets/video/designer-case-3-outcome-v1.mp4","40f68475ec9f61f7c08dbf963cc4afcd63b2e11ed54f7e4d422dc2cc83141881"]]
          for index, (drive_id, name, expected) in enumerate(items, start=1):
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest() == expected:
                  print(f'[{index}/12] Source exact already present: {name}', flush=True)
                  continue
              if target.exists():
                  raise RuntimeError(f'Existing target differs; refusing overwrite: {name}')
              with tempfile.TemporaryDirectory() as folder:
                  partial = pathlib.Path(folder) / 'source.mp4'
                  result = gdown.download(id=drive_id, output=str(partial), quiet=False)
                  if not result or not partial.is_file():
                      raise RuntimeError(f'Drive download failed: {drive_id} -> {name}')
                  raw = partial.read_bytes()
                  digest = hashlib.sha256(raw).hexdigest()
                  if digest != expected:
                      raise RuntimeError(f'SHA256 mismatch for {name}: {digest} != {expected}')
                  os.replace(partial, target)
                  print(f'[{index}/12] Verified {len(raw)} bytes SHA256={digest}: {name}', flush=True)
          print('All twelve designer originals are SHA-verified.', flush=True)
          PY
      - name: Commit ONLY verified original video media
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/video/
          if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
          git commit -m 'assets(video): upload twelve SHA-verified original designer films'
          # Concurrent Visual QA may publish a commit while these files download.
          # Always rebase onto FETCH_HEAD, not a stale shallow-clone remote ref.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/room-case-library-layout-fix-2026-11-14
            git rebase FETCH_HEAD
            if git push origin HEAD:experiment/room-case-library-layout-fix-2026-11-14; then
              echo 'Video originals committed and pushed successfully.'
              exit 0
            fi
            echo "Remote moved concurrently; retrying safe fast-forward (attempt $attempt)"
            sleep 3
          done
          echo 'Push could not get a stable remote tip after six attempts' >&2
          exit 1
